<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเช็คชื่อเข้าเรียน - RSU System</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <!-- Firebase Web SDK (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    h2 { color: #4F46E5; margin-top: 0; font-size: 24px; font-weight: 600; }
    p { font-size: 14px; color: #666; margin-bottom: 20px; }
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; font-weight: 500; color: #4b5563; margin-bottom: 5px; }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: #f9fafb;
    }
    input:focus { border-color: #4F46E5; background: #fff; }
    .btn {
      background: linear-gradient(to right, #4F46E5, #7C3AED);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }
    .status-msg { margin-top: 15px; padding: 12px 15px; border-radius: 12px; font-size: 14px; font-weight: 500; display: none; line-height: 1.4; word-break: break-word; }
    .user-badge { background: #e0e7ff; color: #3730a3; padding: 12px 15px; border-radius: 12px; font-weight: 600; font-size: 15px; margin-bottom: 20px; display: block; white-space: pre-line; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s infinite linear;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <div id="loading-screen" style="padding: 20px 0;">
      <div class="spinner" style="border-top-color: #4F46E5; width: 36px; height: 36px; border-width: 4px;"></div>
      <p style="margin-top: 15px; color: #6b7280; font-weight: 500;">กำลังดาวน์โหลดข้อมูล...</p>
    </div>

    <!-- 1. หน้าลงทะเบียน -->
    <div id="reg-section" style="display: none;">
      <h2>ลงทะเบียนผูกบัญชี</h2>
      <p>ผูกรหัสนักศึกษากับ LINE (ทำรายการเพียงครั้งแรก)</p>
      
      <div class="input-group">
        <label>รหัสนักศึกษา *</label>
        <input type="text" id="std-id" placeholder="เช่น 6501234">
      </div>
      
      <div class="input-group">
        <label>อีเมลมหาวิทยาลัย (ระบุหรือไม่ก็ได้)</label>
        <input type="email" id="std-email" placeholder="student@rsu.ac.th">
      </div>

      <button id="btn-reg" class="btn" onclick="register()">ผูกบัญชีเข้ากับ LINE นี้</button>
    </div>

    <!-- 2. หน้าเช็คชื่อ -->
    <div id="checkin-section" style="display: none;">
      <h2>เช็คชื่อเข้าเรียน</h2>
      <div id="user-info" class="user-badge">👤 ข้อมูลนักศึกษา</div>
      
      <button id="btn-checkin" class="btn" onclick="doCheckIn()">
        📍 กดเช็คชื่อเข้าเรียน
      </button>
    </div>

    <div id="msg-box" class="status-msg"></div>
  </div>

  <script>
    // 📍 Map Google Apps Script URL แยกตามรายวิชา
    const COURSE_URLS = {
      "sec11": "https://script.google.com/macros/s/AKfycbyJYyV4iCiPkXy47dZbPPhrHaJwDSOuxQd2dddsTdGuuy-BP-pj8WB9wFlUXnVp1SIZNA/exec",
      "sec12": "https://script.google.com/macros/s/AKfycbxnhw5GMiNeDqCamGAtKZqDdrS8waeiCEz6p0uKHaaYHs1FQFN-iZj-n4VfeUvx7ELbZA/exec"
    };

    // 📍 ฟังก์ชันอ่าน URL ตามค่า ?course= จาก Rich Menu (ถ้าไม่ระบุจะเลือก sec11 เป็นค่าเริ่มต้น)
    function getGasUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const courseParam = urlParams.get('course') || 'sec11';
      return COURSE_URLS[courseParam] || COURSE_URLS["sec11"];
    }

    const LIFF_ID = "2011504786-hsmDP4Ln";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA84LiAClQ5MHAFrJFGDEkD4CYn1jAwP7M",
      authDomain: "class-check-in-72b0d.firebaseapp.com",
      projectId: "class-check-in-72b0d",
      storageBucket: "class-check-in-72b0d.firebasestorage.app",
      messagingSenderId: "963011374711",
      appId: "1:963011374711:web:b485b5e5f9743f1aa3a072",
      measurementId: "G-WZKMEZ4YF7",
      databaseURL: "https://class-check-in-72b0d-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let lineUserId = "";
    let lineDisplayName = "";
    let registeredStudent = null;

    async function initLIFF() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
          lineDisplayName = profile.displayName;
          checkRegistrationLocal();
        }
      } catch (err) {
        document.getElementById("loading-screen").style.display = "none";
        showMsg("❌ ไม่สามารถเชื่อมต่อกับ LINE ได้", false);
      }
    }

    // ตรวจสอบการลงทะเบียนผ่าน Firebase
    async function checkRegistrationLocal() {
      try {
        const doc = await db.collection("students").doc(lineUserId).get();
        document.getElementById("loading-screen").style.display = "none";

        if (doc.exists) {
          registeredStudent = doc.data();
          document.getElementById("reg-section").style.display = "none";
          document.getElementById("checkin-section").style.display = "block";
          document.getElementById("user-info").innerText = `👤 ${registeredStudent.name}\n(${registeredStudent.id})`;
        } else {
          document.getElementById("checkin-section").style.display = "none";
          document.getElementById("reg-section").style.display = "block";
        }
      } catch (err) {
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("reg-section").style.display = "block";
        console.error("Firebase read error:", err);
      }
    }

    async function register() {
      const stdId = document.getElementById("std-id").value.trim();
      const stdEmail = document.getElementById("std-email").value.trim();

      if (!stdId) return alert("กรุณากรอกรหัสนักศึกษา");

      const btn = document.getElementById("btn-reg");
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> กำลังบันทึกข้อมูล...';
      hideMsg();

      try {
        // เรียกใช้ getGasUrl() เพื่อส่งข้อมูลไปยัง URL ของวิชานั้นๆ
        const res = await fetch(getGasUrl(), {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ 
            action: "register", 
            lineUserId: lineUserId, 
            studentId: stdId, 
            email: stdEmail,
            lineDisplayName: lineDisplayName 
          })
        });

        const data = await res.json();

        if (data.success) {
          try {
            await db.collection("students").doc(lineUserId).set({
              id: stdId,
              name: data.name || stdId,
              email: stdEmail,
              lineDisplayName: lineDisplayName
            });
          } catch (fbErr) {
            console.warn("เซฟลง Firebase ไม่ได้ แต่ข้อมูลเข้า Sheet แล้ว:", fbErr);
          }

          alert("✅ " + data.message);
          
          registeredStudent = { id: stdId, name: data.name || stdId };
          document.getElementById("reg-section").style.display = "none";
          document.getElementById("checkin-section").style.display = "block";
          document.getElementById("user-info").innerText = `👤 ${registeredStudent.name}\n(${registeredStudent.id})`;
          
        } else {
          showMsg(data.message || "❌ ไม่สามารถลงทะเบียนได้", false);
          btn.disabled = false;
          btn.innerText = "ผูกบัญชีเข้ากับ LINE นี้";
        }
      } catch (err) {
        console.error("GAS Error:", err);
        showMsg("❌ เกิดข้อผิดพลาดในการเชื่อมต่อเพื่อลงทะเบียน", false);
        btn.disabled = false;
        btn.innerText = "ผูกบัญชีเข้ากับ LINE นี้";
      }
    }

    function doCheckIn() {
      const btn = document.getElementById("btn-checkin");
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> กำลังอ่านพิกัด...';
      hideMsg();

      if (!navigator.geolocation) {
        showMsg("❌ มือถือของคุณไม่รองรับ GPS", false);
        resetCheckinBtn();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          btn.innerHTML = '<div class="spinner"></div> กำลังส่งข้อมูล...';

          // เรียกใช้ getGasUrl() เพื่อยิงข้อมูลเช็คชื่อไปยัง Google Sheet ให้ตรงวิชา
          fetch(getGasUrl(), {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
              action: "checkIn", 
              lineUserId: lineUserId, 
              studentId: registeredStudent ? registeredStudent.id : "",
              lat: lat, 
              lng: lng,
              lineDisplayName: lineDisplayName 
            })
          })
          .then(async (res) => {
            const rawText = await res.text();
            try {
              return JSON.parse(rawText);
            } catch (e) {
              throw new Error("ระบบตอบกลับข้อมูลผิดรูปแบบ (ไม่ใช่ JSON)");
            }
          })
          .then(data => {
            showMsg(data.message, data.success);
            resetCheckinBtn();
          })
          .catch(err => {
            console.error("Check-in Error:", err);
            showMsg("❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ (" + err.message + ")", false);
            resetCheckinBtn();
          });
        },
        (error) => {
          showMsg("❌ กรุณาเปิดใช้งานสิทธิ์ตำแหน่งที่ตั้ง (GPS)", false);
          resetCheckinBtn();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function resetCheckinBtn() {
      const btn = document.getElementById("btn-checkin");
      btn.disabled = false;
      btn.innerHTML = "📍 กดเช็คชื่อเข้าเรียน";
    }

    function showMsg(text, isSuccess) {
      const msg = document.getElementById("msg-box");
      msg.style.display = "block";
      msg.style.background = isSuccess ? "#D1FAE5" : "#FEE2E2";
      msg.style.color = isSuccess ? "#065F46" : "#991B1B";
      msg.style.border = isSuccess ? "1px solid #A7F3D0" : "1px solid #FECDD3";
      msg.innerText = text;
    }

    function hideMsg() {
      document.getElementById("msg-box").style.display = "none";
    }

    window.onload = initLIFF;
  </script>
</body>
</html>
