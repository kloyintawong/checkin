<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อาจารย์ - ระบบเปิดปิดเช็คชื่อ</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .btn-open { background: #10B981; color: white; padding: 15px; border-radius: 10px; border: none; font-size: 18px; width: 100%; cursor: pointer; margin-bottom: 10px; font-weight: 600; }
    .btn-close { background: #EF4444; color: white; padding: 15px; border-radius: 10px; border: none; font-size: 18px; width: 100%; cursor: pointer; font-weight: 600; }
    .status-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 600; margin-top: 10px; font-size: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>แผงควบคุมอาจารย์</h2>
    <p>สถานะปัจจุบัน:</p>
    <div id="status" class="status-badge">กำลังโหลด...</div>
    
    <div style="margin-top: 30px;">
      <button class="btn-open" onclick="setStatus('OPEN')">🔓 เปิดรับเช็คชื่อ</button>
      <button class="btn-close" onclick="setStatus('CLOSED')">🔒 ปิดรับเช็คชื่อ</button>
    </div>
  </div>

  <script>
    const GAS_URL = "URL_GAS_WEB_APP_ที่นี่";

    async function loadStatus() {
      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getInstructorStatus" })
      });
      const data = await res.json();
      updateBadge(data.status);
    }

    async function setStatus(newStatus) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleClassStatus", status: newStatus })
      });
      const data = await res.json();
      updateBadge(data.status);
    }

    function updateBadge(status) {
      const el = document.getElementById("status");
      if (status === "OPEN") {
        el.innerText = "OPEN (กำลังเปิดรับเช็คชื่อ)";
        el.style.background = "#D1FAE5"; el.style.color = "#065F46";
      } else {
        el.innerText = "CLOSED (ปิดรับเช็คชื่อ)";
        el.style.background = "#FEE2E2"; el.style.color = "#991B1B";
      }
    }

    window.onload = loadStatus;
  </script>
</body>
</html>
