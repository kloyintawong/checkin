<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แผงควบคุมอาจารย์ - RSU System</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    h2 { color: #111827; margin-top: 0; font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    p.subtitle { color: #6b7280; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
    .control-box {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 18px;
      margin-top: 15px;
      text-align: left;
    }
    .course-title {
      font-weight: 600;
      font-size: 16px;
      color: #1f2937;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .box-title { font-weight: 500; font-size: 14px; color: #4b5563; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge-open { background: #D1FAE5; color: #065F46; }
    .badge-closed { background: #FEE2E2; color: #991B1B; }
    .badge-loading { background: #E5E7EB; color: #4B5563; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .btn { padding: 10px 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-green { background: #10B981; color: white; }
    .btn-green:hover { background: #059669; }
    .btn-red { background: #EF4444; color: white; }
    .btn-red:hover { background: #DC2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>👨‍🏫 แผงควบคุมระบบเช็คชื่อ</h2>
    <p class="subtitle">จัดการเปิด-ปิดระบบเช็คชื่อสำหรับอาจารย์ผู้สอน</p>

    <!-- กล่องควบคุมสำหรับทุกรายวิชาจะแสดงที่นี่ -->
    <div id="courses-container"></div>
  </div>

  <script>
    // 📍 รวบรวมข้อมูล URL ของ Google Apps Script ครบทั้ง 4 รายวิชา
    const COURSES = [
      {
        id: "sec11",
        name: "Choir Sec 11",
        url: "https://script.google.com/macros/s/AKfycbyJYyV4iCiPkXy47dZbPPhrHaJwDSOuxQd2dddsTdGuuy-BP-pj8WB9wFlUXnVp1SIZNA/exec"
      },
      {
        id: "sec12",
        name: "Choir Sec 12",
        url: "https://script.google.com/macros/s/AKfycbxnhw5GMiNeDqCamGAtKZqDdrS8waeiCEz6p0uKHaaYHs1FQFN-iZj-n4VfeUvx7ELbZA/exec"
      },
      {
        id: "mus201",
        name: "Music History",
        url: "https://script.google.com/macros/s/AKfycbwIcCGl-1YPiJFkIOiZb-WcL6ms9HmGbNP8NpS_R_V6CalakOxKpMgMzIKPV3hr4Rib/exec"
      },
      {
        id: "performance",
        name: "Performance Class",
        url: "https://script.google.com/macros/s/AKfycbweX7GL-tBzsCa2JrkHzaDk91Mup067qURTTGpdvbh5ba8AgHW0aI22MPcJFN8Olhqk/exec"
      }
    ];

    // สร้างกล่องควบคุมแต่ละวิชาขึ้นมาบนหน้าจอ
    function renderUI() {
      const container = document.getElementById("courses-container");
      container.innerHTML = "";

      COURSES.forEach(course => {
        const box = document.createElement("div");
        box.className = "control-box";
        box.innerHTML = `
          <div class="course-title">🎼 ${course.name}</div>
          <div class="box-title">
            <span>สถานะระบบ:</span>
            <span id="badge-${course.id}" class="badge badge-loading">กำลังโหลด...</span>
          </div>
          <div class="btn-group">
            <button id="btn-open-${course.id}" class="btn btn-green" onclick="setClassStatus('${course.id}', 'OPEN')">🔓 เปิดรับเช็คชื่อ</button>
            <button id="btn-close-${course.id}" class="btn btn-red" onclick="setClassStatus('${course.id}', 'CLOSED')">🔒 ปิดรับเช็คชื่อ</button>
          </div>
        `;
        container.appendChild(box);
      });
    }

    // ดึงสถานะปัจจุบันของทุกวิชาเมื่อเปิดหน้าเว็บ
    async function loadAllStatuses() {
      COURSES.forEach(course => {
        loadStatus(course);
      });
    }

    async function loadStatus(course) {
      try {
        const res = await fetch(course.url, {
          method: "POST",
          redirect: "follow",
          body: JSON.stringify({ action: "getInstructorStatus" })
        });
        const data = await res.json();
        updateUI(course.id, data.classStatus);
      } catch (err) {
        console.error("Error loading status for " + course.name, err);
        const badge = document.getElementById(`badge-${course.id}`);
        if (badge) {
          badge.innerText = "เกิดข้อผิดพลาด";
          badge.className = "badge badge-closed";
        }
      }
    }

    // ฟังก์ชันสำหรับกดเปิด หรือ ปิดรับเช็คชื่อ
    async function setClassStatus(courseId, status) {
      const course = COURSES.find(c => c.id === courseId);
      if (!course) return;

      toggleButtons(courseId, true);
      const badge = document.getElementById(`badge-${courseId}`);
      if (badge) {
        badge.innerText = "กำลังบันทึก...";
        badge.className = "badge badge-loading";
      }

      try {
        const res = await fetch(course.url, {
          method: "POST",
          redirect: "follow",
          body: JSON.stringify({ action: "toggleClassStatus", status: status })
        });
        const data = await res.json();
        updateUI(courseId, data.status);
      } catch (err) {
        alert("❌ เปลี่ยนสถานะวิชา " + course.name + " ไม่สำเร็จ");
        loadStatus(course); // โหลดสถานะเดิมกลับมาแสดง
      }
      toggleButtons(courseId, false);
    }

    function updateUI(courseId, status) {
      const badge = document.getElementById(`badge-${courseId}`);
      if (!badge) return;

      if (status === "OPEN") {
        badge.innerText = "เปิดใช้งาน";
        badge.className = "badge badge-open";
      } else {
        badge.innerText = "ปิดใช้งาน";
        badge.className = "badge badge-closed";
      }
    }

    function toggleButtons(courseId, disabled) {
      const btnOpen = document.getElementById(`btn-open-${courseId}`);
      const btnClose = document.getElementById(`btn-close-${courseId}`);
      if (btnOpen) btnOpen.disabled = disabled;
      if (btnClose) btnClose.disabled = disabled;
    }

    window.onload = () => {
      renderUI();
      loadAllStatuses();
    };
  </script>
</body>
</html>
