<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แผงควบคุมอาจารย์</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0;
      background: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }
    h2 { color: #111827; margin-top: 0; font-size: 22px; font-weight: 600; }
    .control-box {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }
    .box-title { font-weight: 600; font-size: 15px; color: #374151; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge-open { background: #D1FAE5; color: #065F46; }
    .badge-closed { background: #FEE2E2; color: #991B1B; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .btn { padding: 12px; border-radius: 10px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-green { background: #10B981; color: white; }
    .btn-red { background: #EF4444; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="card">
    <h2>👨‍🏫 แผงควบคุมระบบเช็คชื่อ</h2>

    <div class="control-box">
      <div class="box-title">
        <span>สถานะระบบเช็คชื่อ:</span>
        <span id="class-badge" class="badge badge-closed">...</span>
      </div>
      <div class="btn-group">
        <button id="btn-open" class="btn btn-green" onclick="setClassStatus('OPEN')">🔓 เปิดรับเช็คชื่อ</button>
        <button id="btn-close" class="btn btn-red" onclick="setClassStatus('CLOSED')">🔒 ปิดรับเช็คชื่อ</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxb_5rtbaSqOX6epf_VvflvV3UtL2IXiiqm69xR3EAvg-_3uXYuRduMs8kNW8a_V1WGkQ/exec";

    async function loadStatus() {
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          redirect: "follow", // 💡 แก้ไข: เพิ่ม redirect
          body: JSON.stringify({ action: "getInstructorStatus" })
        });
        const data = await res.json();
        updateUI(data.classStatus);
      } catch (err) {
        alert("❌ ไม่สามารถดึงสถานะระบบได้");
      }
    }

    async function setClassStatus(status) {
      toggleButtons(true);
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          redirect: "follow", // 💡 แก้ไข: เพิ่ม redirect
          body: JSON.stringify({ action: "toggleClassStatus", status: status })
        });
        const data = await res.json();
        updateUI(data.status);
      } catch (err) {
        alert("❌ เปลี่ยนสถานะไม่สำเร็จ");
      }
      toggleButtons(false);
    }

    function updateUI(status) {
      const badge = document.getElementById("class-badge");
      if (status === "OPEN") {
        badge.innerText = "เปิดใช้งาน";
        badge.className = "badge badge-open";
      } else {
        badge.innerText = "ปิดใช้งาน";
        badge.className = "badge badge-closed";
      }
    }

    function toggleButtons(disabled) {
      document.getElementById("btn-open").disabled = disabled;
      document.getElementById("btn-close").disabled = disabled;
    }

    window.onload = loadStatus;
  </script>
</body>
</html>
