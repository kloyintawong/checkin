<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instructor Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0;
      background-color: #f1f5f9;
      color: #334155;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    h2 { 
      color: #0f172a; 
      margin: 0 0 24px 0; 
      font-size: 20px; 
      font-weight: 600; 
      text-align: center;
      letter-spacing: -0.02em;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      color: #0f172a;
      background-color: #f8fafc;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 16px top 50%;
      background-size: 10px auto;
    }
    select:focus {
      border-color: #3b82f6;
      background-color: #ffffff;
    }
    .status-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
    }
    .status-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px;
    }
    .status-label {
      font-size: 14px;
      font-weight: 500;
      color: #475569;
    }
    .badge { 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-open { background: #dcfce7; color: #166534; }
    .badge-closed { background: #f1f5f9; color: #64748b; }
    .badge-loading { background: #fef9c3; color: #854d0e; }
    
    .btn-group { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
    }
    .btn { 
      padding: 14px; 
      border-radius: 10px; 
      border: none; 
      font-size: 14px; 
      font-weight: 600; 
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { 
      background: #0ea5e9; 
      color: white; 
    }
    .btn-primary:hover:not(:disabled) { background: #0284c7; }
    
    .btn-secondary { 
      background: #e2e8f0; 
      color: #475569; 
    }
    .btn-secondary:hover:not(:disabled) { background: #cbd5e1; }
    
    .btn:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
    }
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Instructor Control Panel</h2>

    <div class="form-group">
      <label for="course-select">เลือกรายวิชา (Select Course)</label>
      <select id="course-select" onchange="onCourseChange()">
        <option value="sec11">Choir Sec 11</option>
        <option value="sec12">Choir Sec 12</option>
        <option value="musichistory">Music History</option>
        <option value="performance">Performance Class</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="status-container">
      <div class="status-header">
        <span class="status-label">สถานะระบบปัจจุบัน</span>
        <span id="class-badge" class="badge badge-loading">กำลังโหลด...</span>
      </div>
      <div class="btn-group">
        <button id="btn-open" class="btn btn-primary" onclick="setClassStatus('OPEN')">เปิดรับเช็คชื่อ</button>
        <button id="btn-close" class="btn btn-secondary" onclick="setClassStatus('CLOSED')">ปิดรับเช็คชื่อ</button>
      </div>
    </div>
  </div>

  <script>
    // Map URL ของ Google Apps Script แต่ละวิชา
    const COURSE_URLS = {
      "sec11": "https://script.google.com/macros/s/AKfycbyJYyV4iCiPkXy47dZbPPhrHaJwDSOuxQd2dddsTdGuuy-BP-pj8WB9wFlUXnVp1SIZNA/exec",
      "sec12": "https://script.google.com/macros/s/AKfycbxnhw5GMiNeDqCamGAtKZqDdrS8waeiCEz6p0uKHaaYHs1FQFN-iZj-n4VfeUvx7ELbZA/exec",
      "musichistory": "https://script.google.com/macros/s/AKfycbwIcCGl-1YPiJFkIOiZb-WcL6ms9HmGbNP8NpS_R_V6CalakOxKpMgMzIKPV3hr4Rib/exec",
      "performance": "https://script.google.com/macros/s/AKfycbweX7GL-tBzsCa2JrkHzaDk91Mup067qURTTGpdvbh5ba8AgHW0aI22MPcJFN8Olhqk/exec"
    };

    function getSelectedUrl() {
      const selectedCourse = document.getElementById("course-select").value;
      return COURSE_URLS[selectedCourse];
    }

    // เมื่อเปลี่ยนวิชาใน Dropdown ให้โหลดสถานะใหม่ทันที
    function onCourseChange() {
      loadStatus();
    }

    async function loadStatus() {
      toggleButtons(true);
      updateUI("LOADING"); 
      try {
        const url = getSelectedUrl();
        const res = await fetch(url, {
          method: "POST",
          redirect: "follow",
          body: JSON.stringify({ action: "getInstructorStatus" })
        });
        const data = await res.json();
        updateUI(data.classStatus);
      } catch (err) {
        updateUI("ERROR");
        alert("ไม่สามารถดึงสถานะระบบได้ กรุณาลองใหม่อีกครั้ง");
      }
      toggleButtons(false);
    }

    async function setClassStatus(status) {
      toggleButtons(true);
      updateUI("LOADING"); 
      try {
        const url = getSelectedUrl();
        const res = await fetch(url, {
          method: "POST",
          redirect: "follow",
          body: JSON.stringify({ action: "toggleClassStatus", status: status })
        });
        const data = await res.json();
        updateUI(data.status);
      } catch (err) {
        alert("เปลี่ยนสถานะไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
        loadStatus(); // โหลดสถานะเดิมกลับมาหาก Error
      }
      toggleButtons(false);
    }

    function updateUI(status) {
      const badge = document.getElementById("class-badge");
      if (status === "OPEN") {
        badge.innerText = "เปิดใช้งาน";
        badge.className = "badge badge-open";
      } else if (status === "LOADING") {
        badge.innerText = "กำลังโหลด...";
        badge.className = "badge badge-loading";
      } else if (status === "ERROR") {
        badge.innerText = "ไม่ทราบสถานะ";
        badge.className = "badge badge-closed";
      } else {
        badge.innerText = "ปิดใช้งาน";
        badge.className = "badge badge-closed";
      }
    }

    function toggleButtons(disabled) {
      document.getElementById("btn-open").disabled = disabled;
      document.getElementById("btn-close").disabled = disabled;
      document.getElementById("course-select").disabled = disabled;
    }

    // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
    window.onload = loadStatus;
  </script>
</body>
</html>
